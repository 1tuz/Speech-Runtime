<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">Архитектура Speech Runtime</title>
        <desc id="architecture-desc">Приложения обращаются по HTTP и WebSocket к демону speechd, который держит каталог моделей и запускает три процесса-воркера: ONNX, CoreML и MLX.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Noto Serif', 'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: worker processes (drawn before arrows and nodes) -->
        <rect x="560" y="96" width="360" height="372" rx="8"
              fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="692" y="100" width="96" height="16" rx="2" fill="#f5f5f5"/>
        <text x="740" y="112" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">ВОРКЕР-ПРОЦЕССЫ</text>

        <!-- Arrows first (behind boxes) -->
        <line x1="208" y1="288" x2="280" y2="288" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>

        <line x1="380" y1="352" x2="380" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>

        <path d="M 480,256 H 524 Q 532,256 532,248 V 184 Q 532,176 540,176 H 584"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <line x1="480" y1="288" x2="584" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <path d="M 480,320 H 540 Q 548,320 548,328 V 392 Q 548,400 556,400 H 584"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>

        <!-- Arrow labels -->
        <rect x="216" y="264" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <text x="244" y="276" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP + WS</text>

        <rect x="388" y="356" width="76" height="16" rx="2" fill="#f5f5f5"/>
        <text x="392" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PULL · VERIFY</text>

        <!-- Node: Applications (input) -->
        <rect x="40" y="244" width="168" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="244" width="168" height="88" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="48" y="252" width="28" height="16" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="62" y="264" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APPS</text>
        <text x="124" y="290" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Приложения</text>
        <text x="124" y="306" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Swift · Rust · CLI · SDK</text>

        <!-- Node: speechd (focal) -->
        <rect x="280" y="224" width="200" height="128" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="224" width="200" height="128" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="288" y="232" width="36" height="16" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="306" y="244" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DAEMON</text>
        <text x="380" y="285" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">speechd</text>
        <text x="380" y="301" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">маршрутизация · очередь · сессии</text>

        <!-- Node: model catalog (store) -->
        <rect x="280" y="392" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="392" width="200" height="80" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="288" y="400" width="32" height="16" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="304" y="412" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="380" y="434" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Каталог моделей</text>
        <text x="380" y="450" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CAS · sha256 · revisions</text>

        <!-- Node: worker-onnx -->
        <rect x="584" y="132" width="312" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="584" y="132" width="312" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="592" y="140" width="28" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="606" y="152" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROC</text>
        <text x="740" y="178" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">worker-onnx</text>
        <text x="740" y="194" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sherpa-onnx · GigaAM v3</text>

        <!-- Node: worker-coreml -->
        <rect x="584" y="244" width="312" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="584" y="244" width="312" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="592" y="252" width="28" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="606" y="264" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROC</text>
        <text x="740" y="290" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">worker-coreml</text>
        <text x="740" y="306" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FluidAudio · Nemotron 3.5</text>

        <!-- Node: worker-mlx -->
        <rect x="584" y="356" width="312" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="584" y="356" width="312" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="592" y="364" width="28" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="606" y="376" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROC</text>
        <text x="740" y="402" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">worker-mlx</text>
        <text x="740" y="418" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">speech-swift · Qwen3-ASR</text>

        <!-- Legend strip -->
        <line x1="40" y1="508" x2="920" y2="508" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="534" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="60" y="542" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Фокус (control plane)</text>

        <rect x="200" y="534" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="220" y="542" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Воркер-процесс</text>

        <rect x="300" y="534" width="14" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="320" y="542" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Хранилище</text>

        <rect x="380" y="534" width="14" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="400" y="542" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Клиент</text>

        <line x1="460" y1="539" x2="488" y2="539" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
        <text x="496" y="542" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP + WS</text>

        <line x1="560" y1="539" x2="588" y2="539" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <text x="596" y="542" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">IPC</text>
      </svg>
