<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Model &amp; Session Lifecycle</title><style>body{margin:0;background:#171b23;color:#f1f3f5;font-family:system-ui,sans-serif}.diagram-container{width:100%;overflow-x:auto}svg{display:block;width:100%;min-width:1280px}.title{font:600 30px system-ui,sans-serif;fill:#f1f3f5}.node{font:600 22px system-ui,sans-serif;fill:#f1f3f5}.sub{font:17px system-ui,sans-serif;fill:#c2cad6}.label{font:16px system-ui,sans-serif;fill:#c2cad6}@media print{.diagram-container{overflow-x:visible}svg{min-width:0}}</style></head><body><div class="diagram-container"><svg viewBox="0 0 1280 720" role="img" aria-labelledby="model-session-lifecycle-title model-session-lifecycle-desc"><title id="model-session-lifecycle-title">Model &amp; Session Lifecycle</title><desc id="model-session-lifecycle-desc">Модель устанавливается, подготавливается и загружается для возможного совместного использования независимыми сессиями, затем может выгружаться; ошибки сообщаются явно.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a6b4c6"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#171b23"/><text x="48" y="64" class="title">Model &amp; Session Lifecycle</text><path d="M 268 224 H 304" fill="none" stroke="#a6b4c6" stroke-width="2" marker-end="url(#arrow)"/><path d="M 500 224 H 536" fill="none" stroke="#a6b4c6" stroke-width="2" marker-end="url(#arrow)"/><path d="M 732 224 H 768" fill="none" stroke="#a6b4c6" stroke-width="2" marker-end="url(#arrow)"/><path d="M 964 224 H 1000" fill="none" stroke="#a6b4c6" stroke-width="2" marker-end="url(#arrow)"/><path d="M 866 264 V 360" fill="none" stroke="#a6b4c6" stroke-width="2" marker-end="url(#arrow)"/><path d="M 964 400 H 1000" fill="none" stroke="#a6b4c6" stroke-width="2" marker-end="url(#arrow)"/><rect x="72" y="184" width="196" height="80" rx="6" fill="#242b37" stroke="#a6b4c6"/><text x="92" y="216" class="node">Установка</text><text x="92" y="241" class="sub">артефакт</text><rect x="304" y="184" width="196" height="80" rx="6" fill="#242b37" stroke="#a6b4c6"/><text x="324" y="216" class="node">Подготовка</text><text x="324" y="241" class="sub">если нужна</text><rect x="536" y="184" width="196" height="80" rx="6" fill="#242b37" stroke="#a6b4c6"/><text x="556" y="216" class="node">Загрузка</text><text x="556" y="241" class="sub">веса в памяти</text><rect x="768" y="184" width="196" height="80" rx="6" fill="#242b37" stroke="#f1a66a"/><text x="788" y="216" class="node">Использование</text><text x="788" y="241" class="sub">если поддерживается</text><rect x="1000" y="184" width="208" height="80" rx="6" fill="#242b37" stroke="#a6b4c6"/><text x="1020" y="216" class="node">Выгрузка</text><text x="1020" y="241" class="sub">когда не занят</text><rect x="768" y="360" width="196" height="80" rx="6" fill="#242b37" stroke="#a6b4c6"/><text x="788" y="392" class="node">Сессии</text><text x="788" y="417" class="sub">независимое состояние</text><rect x="1000" y="360" width="208" height="80" rx="6" fill="#242b37" stroke="#a6b4c6"/><text x="1020" y="392" class="node">Завершение</text><text x="1020" y="417" class="sub">или отмена</text><text x="72" y="136" class="label">МОДЕЛЬ</text><text x="768" y="328" class="label">КЛИЕНТСКИЕ СЕССИИ</text><text x="72" y="512" class="label">Ошибка установки, подготовки или загрузки → явный результат клиенту.</text><text x="72" y="552" class="label">Падение воркера → ошибка затронутых сессий; сервис остаётся доступен.</text><text x="72" y="592" class="label">Используемую модель нельзя удалить; политика восстановления требует проверки.</text><text x="72" y="640" class="label">PROPOSED · порядок и механизмы не являются реализацией</text></svg></div></body></html>
