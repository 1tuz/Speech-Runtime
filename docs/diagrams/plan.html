<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speech Runtime · План по зависимостям</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Noto Serif', 'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · Speech Runtime</p>
    <h1>План реализации по зависимостям</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plan-title plan-desc">
        <title id="plan-title">План реализации Speech Runtime по зависимостям</title>
        <desc id="plan-desc">Семь этапов: риск-спайки, ядро, затем параллельно стриминг и Apple-движки, затем адаптация со спикерами, эксплуатация и интеграция.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: parallel stages (before arrows and nodes) -->
        <rect x="320" y="100" width="152" height="300" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="344" y="104" width="104" height="16" rx="2" fill="#f5f5f5"/>
        <text x="396" y="116" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">ПАРАЛЛЕЛЬНО</text>

        <!-- Arrows first (behind boxes) -->
        <line x1="152" y1="248" x2="176" y2="248" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <path d="M 288,236 H 384 Q 392,236 392,228 V 184"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 288,260 H 384 Q 392,260 392,268 V 316"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <path d="M 448,152 H 472 Q 480,152 480,160 V 224 Q 480,232 488,232 H 504"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 448,348 H 472 Q 480,348 480,340 V 272 Q 480,264 488,264 H 504"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="616" y1="248" x2="656" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="768" y1="248" x2="800" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Node: 0 risk spikes (focal) -->
        <rect x="40" y="216" width="112" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="216" width="112" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="48" y="224" width="16" height="16" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="56" y="236" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">0</text>
        <text x="96" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Риск-спайки</text>
        <text x="96" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CoreML · sherpa</text>

        <!-- Node: 1 core -->
        <rect x="176" y="216" width="112" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="176" y="216" width="112" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="184" y="224" width="16" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="192" y="236" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <text x="232" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ядро</text>
        <text x="232" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">speechd · реестр</text>

        <!-- Node: 2 streaming -->
        <rect x="336" y="120" width="112" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="336" y="120" width="112" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="344" y="128" width="16" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="352" y="140" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">2</text>
        <text x="392" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Стриминг</text>
        <text x="392" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">WS · VAD · EOT</text>

        <!-- Node: 3 apple engines -->
        <rect x="336" y="316" width="112" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="336" y="316" width="112" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="344" y="324" width="16" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="352" y="336" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">3</text>
        <text x="392" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Apple-движки</text>
        <text x="392" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CoreML · MLX</text>

        <!-- Node: 4-5 adaptation -->
        <rect x="504" y="216" width="112" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="504" y="216" width="112" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="512" y="224" width="24" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="524" y="236" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">4–5</text>
        <text x="560" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Адаптация</text>
        <text x="560" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bias · спикеры</text>

        <!-- Node: 6 operations -->
        <rect x="656" y="216" width="112" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="656" y="216" width="112" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="664" y="224" width="16" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="672" y="236" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">6</text>
        <text x="712" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Эксплуатация</text>
        <text x="712" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TTL · recovery</text>

        <!-- Node: 7 integration -->
        <rect x="800" y="216" width="112" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="800" y="216" width="112" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="808" y="224" width="16" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="816" y="236" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">7</text>
        <text x="856" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Интеграция</text>
        <text x="856" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">[OI] · SDK</text>

        <!-- Legend strip -->
        <line x1="40" y1="428" x2="920" y2="428" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="454" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="60" y="462" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Этап</text>

        <rect x="140" y="454" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="160" y="462" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">С чего начинать</text>

        <rect x="292" y="454" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="312" y="462" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Можно вести параллельно</text>

        <line x1="500" y1="459" x2="528" y2="459" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="536" y="462" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Зависимость</text>

        <line x1="640" y1="459" x2="668" y2="459" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="676" y="462" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Первый шаг</text>
      </svg>
    </div>
  </div>
</body>
</html>
