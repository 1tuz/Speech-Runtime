<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="runtime-architecture-title runtime-architecture-desc" id="runtime-architecture-root"><title id="runtime-architecture-title">Runtime Architecture</title><desc id="runtime-architecture-desc">Предлагаемый управляющий сервис связывает клиентов с каталогом моделей, сессиями и заменяемыми вычислительными воркерами.</desc><defs>
      <style>#runtime-architecture-root { color: #f1f3f5; font-family: system-ui,sans-serif; }
      #runtime-architecture-root .diagram-container { width:100%;overflow-x:auto }
      #runtime-architecture-root .title { font:600 30px system-ui,sans-serif;fill:#f1f3f5 }
      #runtime-architecture-root .node { font:600 22px system-ui,sans-serif;fill:#f1f3f5 }
      #runtime-architecture-root .sub { font:17px system-ui,sans-serif;fill:#c2cad6 }
      #runtime-architecture-root .label { font:16px system-ui,sans-serif;fill:#c2cad6 }
      @media print {
#runtime-architecture-root .diagram-container { overflow-x:visible }
}</style><marker id="runtime-architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a6b4c6"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#171b23"/><text x="48" y="64" class="title">Runtime Architecture</text><path d="M 296 356 H 392" fill="none" stroke="#a6b4c6" stroke-width="2" marker-end="url(#runtime-architecture-arrow)"/><path d="M 504 300 V 196 Q 504 188 512 188 H 744" fill="none" stroke="#a6b4c6" stroke-width="2" marker-end="url(#runtime-architecture-arrow)"/><path d="M 616 356 H 744" fill="none" stroke="#a6b4c6" stroke-width="2" marker-end="url(#runtime-architecture-arrow)"/><path d="M 504 412 V 516 Q 504 524 512 524 H 744" fill="none" stroke="#a6b4c6" stroke-width="2" marker-end="url(#runtime-architecture-arrow)"/><rect x="64" y="312" width="232" height="88" rx="6" fill="#242b37" stroke="#a6b4c6"/><text x="84" y="344" class="node">Клиенты</text><text x="84" y="369" class="sub">модель + операция</text><rect x="392" y="300" width="224" height="112" rx="6" fill="#242b37" stroke="#f1a66a"/><text x="412" y="332" class="node">API и управление</text><text x="412" y="357" class="sub">доступ, координация</text><rect x="744" y="144" width="400" height="88" rx="6" fill="#242b37" stroke="#a6b4c6"/><text x="764" y="176" class="node">Каталог моделей</text><text x="764" y="201" class="sub">версии, целостность, кэш</text><rect x="744" y="312" width="400" height="88" rx="6" fill="#242b37" stroke="#a6b4c6"/><text x="764" y="344" class="node">Сессии и планирование</text><text x="764" y="369" class="sub">состояние, очереди, отмена</text><rect x="744" y="480" width="400" height="88" rx="6" fill="#242b37" stroke="#a6b4c6"/><text x="764" y="512" class="node">Заменяемые воркеры</text><text x="764" y="537" class="sub">изолированные вычисления</text><text x="64" y="620" class="label">PROPOSED · границы и взаимодействия уточняются экспериментами</text><text x="744" y="606" class="label">Число воркеров и движков не задано заранее.</text></svg>
