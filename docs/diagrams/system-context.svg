<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="system-context-title system-context-desc" id="system-context-root"><title id="system-context-title">System Context</title><desc id="system-context-desc">Независимые клиентские приложения обращаются к общему локальному Speech Runtime.</desc><defs>
      <style>#system-context-root { color: #f1f3f5; font-family: system-ui,sans-serif; }
      #system-context-root .diagram-container { width:100%;overflow-x:auto }
      #system-context-root .title { font:600 30px system-ui,sans-serif;fill:#f1f3f5 }
      #system-context-root .node { font:600 22px system-ui,sans-serif;fill:#f1f3f5 }
      #system-context-root .sub { font:17px system-ui,sans-serif;fill:#c2cad6 }
      #system-context-root .label { font:16px system-ui,sans-serif;fill:#c2cad6 }
      @media print {
#system-context-root .diagram-container { overflow-x:visible }
}</style><marker id="system-context-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a6b4c6"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#171b23"/><text x="48" y="64" class="title">System Context</text><path d="M 360 208 H 472 Q 480 208 480 216 V 332 H 560" fill="none" stroke="#a6b4c6" stroke-width="2" marker-end="url(#system-context-arrow)"/><path d="M 360 356 H 560" fill="none" stroke="#a6b4c6" stroke-width="2" marker-end="url(#system-context-arrow)"/><path d="M 360 504 H 472 Q 480 504 480 496 V 380 H 560" fill="none" stroke="#a6b4c6" stroke-width="2" marker-end="url(#system-context-arrow)"/><rect x="64" y="164" width="296" height="88" rx="6" fill="#242b37" stroke="#a6b4c6"/><text x="84" y="196" class="node">Приложение A</text><text x="84" y="221" class="sub">сценарий и интерфейс</text><rect x="64" y="312" width="296" height="88" rx="6" fill="#242b37" stroke="#a6b4c6"/><text x="84" y="344" class="node">Приложение B</text><text x="84" y="369" class="sub">сценарий и интерфейс</text><rect x="64" y="460" width="296" height="88" rx="6" fill="#242b37" stroke="#a6b4c6"/><text x="84" y="492" class="node">Другие клиенты</text><text x="84" y="517" class="sub">независимые сессии</text><rect x="560" y="304" width="400" height="104" rx="6" fill="#242b37" stroke="#f1a66a"/><text x="580" y="336" class="node">Speech Runtime</text><text x="580" y="361" class="sub">общий локальный сервис</text><text x="564" y="450" class="label">Клиент выбирает модель и операцию.</text><text x="564" y="484" class="label">Модели хранятся и используются совместно при возможности.</text><text x="64" y="620" class="label">Схема назначения · архитектура и возможности требуют проверки</text></svg>
